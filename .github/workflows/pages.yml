name: Site

on:
  push:
    branches: [main]
    paths: &site
      - web/**
      - docs/**
      - package.json
      - package-lock.json
      - recipes/**
      - benchmarks/runs/*.json
      - install.sh
      - README.md
      - pyproject.toml
      - snowllm/hub/recipes.py
      - snowllm/_version.py
      - scripts/check-site.py
      - scripts/build-recipes.py
      - scripts/build-benchmarks.py
      - .github/workflows/pages.yml
  pull_request:
    paths: *site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build documentation
        run: |
          npm ci
          npm run docs:build

      - name: Every recipe is well formed
        run: scripts/build-recipes.py --check

      - name: Assemble the benchmark data the page draws
        run: scripts/build-benchmarks.py

      - name: The site agrees with the tree it is published from
        run: scripts/check-site.py

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build documentation
        run: |
          npm ci
          npm run docs:build

      - name: Include documentation in the published site
        run: cp -r docs/.vitepress/dist web/docs

      - name: Date the sitemap from the last change to the site
        run: |
          stamp=$(git log -1 --format=%cs -- web)
          [ -n "$stamp" ] || {
              echo "::error::no commit touches web/, so the sitemap cannot be dated" >&2
              exit 1
          }
          python - "$stamp" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("web/sitemap.xml")
          s = p.read_text()
          out, n = re.subn(r"<lastmod>[^<]*</lastmod>", f"<lastmod>{sys.argv[1]}</lastmod>", s)
          if n != 1:
              sys.exit(f"::error::expected one <lastmod> in web/sitemap.xml, found {n}")
          p.write_text(out)
          print(f"sitemap lastmod = {sys.argv[1]}")
          PY

      - name: Serve the installer the site tells people to pipe
        run: cp install.sh web/install.sh

      - name: Assemble the catalogue `snowllm pull` reads
        run: scripts/build-recipes.py

      - name: Assemble the benchmark data the page draws
        run: scripts/build-benchmarks.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
