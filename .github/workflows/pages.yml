name: Site

on:
  push:
    branches: [main]
    paths: &site
      - web/**
      - docs/**
      - package.json
      - package-lock.json
      - recipes/**
      - benchmarks/runs/*.json
      - benchmarks/runs/*.json.outdated
      - install.sh
      - CHANGELOG.md
      - README.md
      - pyproject.toml
      - snowllm/hub/recipes.py
      - snowllm/config.py
      - snowllm/_version.py
      - scripts/build-sitemap.py
      - scripts/check-site.py
      - scripts/build-recipes.py
      - scripts/check-recipe-clients.py
      - tests/test_recipe_compatibility.py
      - scripts/build-benchmarks.py
      - tests/test_benchmark_page.py
      - tests/test_install_targets.py
      - tests/test_install_ui.mjs
      - .github/workflows/pages.yml
  pull_request:
    paths: *site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Build the site and sitemap
        run: |
          npm ci
          npm run site:build

      - name: Every recipe is well formed
        run: scripts/build-recipes.py --check

      - name: Recipe compatibility with published clients
        run: |
          python -m unittest discover -s tests -p test_recipe_compatibility.py
          python -m pip download --no-deps --only-binary=:all: -d "$RUNNER_TEMP/recipe-clients" "snowllm==0.3.13"
          python scripts/check-recipe-clients.py "$RUNNER_TEMP/recipe-clients"

      - name: Benchmark HTML preserves every measurement
        run: python -m unittest discover -s tests -p test_benchmark_page.py

      - name: The site agrees with the tree it is published from
        run: scripts/check-site.py

      - name: APU install targets match the website
        run: python -m unittest discover -s tests -p test_install_targets.py

      - name: Install channels select published releases
        run: node --test tests/test_install_ui.mjs

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
