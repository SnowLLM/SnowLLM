name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+.dev[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c 'import pathlib, re; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("snowllm/_version.py").read_text()).group(1))')
          [ "$tag" = "$declared" ] || {
              echo "::error::tag $GITHUB_REF_NAME says $tag, snowllm/_version.py says $declared" >&2
              exit 1
          }

      - name: Build
        run: |
          python -m pip install --upgrade pip setuptools
          scripts/build-wheel.sh dist --python-only

      - name: dist/ holds nothing but this release's wheel
        run: |
          expected="snowllm-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          got=$(cd dist && echo *)
          [ "$got" = "$expected" ] || {
              echo "::error::expected $expected in dist/, found: $got" >&2
              exit 1
          }

      - uses: pypa/gh-action-pypi-publish@release/v1
