[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "snowllm"
dynamic = ["version", "readme"]
description = "Hand-written HIP kernels for LLM inference on AMD Ryzen AI Max (Strix Halo)"
requires-python = ">=3.10"
authors = [{ name = "ColorsWind", email = "14761584+ColorsWind@users.noreply.github.com" }]
keywords = ["hip", "rocm", "amd", "llm", "inference"]
dependencies = ["snowllm-kernels==0.3.11", "fastapi", "uvicorn", "httpx", "pydantic>=2", "transformers", "pillow", "packaging"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["openai", "anthropic", "httpx", "safetensors", "transformers", "numpy", "pillow"]

[project.scripts]
snowllm = "snowllm.cli:main"


[project.urls]
Repository = "https://github.com/SnowLLM/SnowLLM"
Issues = "https://github.com/SnowLLM/SnowLLM/issues"


[tool.setuptools.dynamic]
version = { attr = "snowllm._version.__version__" }
readme = { file = ["README.md", "CHANGELOG.md"], content-type = "text/markdown" }

[tool.setuptools.packages.find]
where = ["."]
include = ["snowllm*"]

[tool.setuptools.cmdclass]
build_py = "snowllm._build.BundleRecipes"

[tool.setuptools.package-data]
"snowllm.models.deepseek_v4" = ["LICENSE-DeepSeek.txt"]
"snowllm.daemon" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/locales/*.json"]
